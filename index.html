<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07375c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Turnos TPA"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><title>Turnos TPA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 100% 0%,#0d6285 0,transparent 48%),linear-gradient(145deg,#071d35,#0b4871);font:16px system-ui,-apple-system,sans-serif;color:white;padding:24px}.card{max-width:420px;width:100%;background:#ffffffeb;color:#102c49;border-radius:28px;padding:32px 25px;text-align:center;box-shadow:0 20px 55px #0003}.logo{width:108px;height:108px;object-fit:contain;border-radius:24px;background:white;padding:6px}h1{font-size:23px;line-height:1.2;margin:18px 0 10px}p{line-height:1.5;color:#526476}a{display:block;background:#07608c;color:white;text-decoration:none;font-weight:750;border-radius:14px;padding:15px 18px;margin-top:24px}.help{margin-top:15px;font-size:13px}#missing{display:none;color:#a04426}</style></head><body><main class="card"><img class="logo" src="icon-192.png" alt="Logo de TPA"><h1>Trabajadores de los Puertos Andaluces</h1><p>Tu calendario laboral, tus turnos y tus anotaciones.</p><a id="open" href="#">Abrir mi calendario</a><p class="help">Esta pantalla sirve de acceso a nuestro calendario de Google Apps Script.</p><p id="missing">Antes de publicar, el administrador debe añadir el enlace /exec en config.js.</p></main><script src="config.js"></script><script>const link=document.getElementById('open');try{const u=new URL(CALENDARIO_URL);if(u.protocol==='https:'&&u.hostname.endsWith('script.google.com')&&u.pathname.endsWith('/exec')){link.href=u.href;}else{document.getElementById('missing').style.display='block';link.style.display='none';}}catch(e){document.getElementById('missing').style.display='block';link.style.display='none';}</script></body></html>
